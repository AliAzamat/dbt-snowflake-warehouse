version: 2

models:
  - name: mart_revenue
    description: "Paid revenue and order count by region. The official KPI source."
    columns:
      - name: region
        description: "Sales region."
        tests:
          - not_null
          - accepted_values:
              values: ['AMER', 'EMEA', 'APAC']
      - name: revenue
        tests:
          - not_null
      - name: paid_orders
        tests:
          - not_null
